# Publie l'app sur Expo (EAS Update) à chaque push sur main.
# La mise à jour s'ouvre dans l'app Expo Go depuis la page du projet sur expo.dev.
name: Publier sur Expo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # Clés publiques Supabase (la clé « publishable » est faite pour être embarquée dans l'app).
      EXPO_PUBLIC_SUPABASE_URL: https://ttbnpayuvwvhcceciwdb.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_xbYy6Pttz2hdcHsci1K8xg__jP_jxye
    steps:
      - uses: actions/checkout@v4

      # Tant que le projet Expo n'est pas relié (clé EXPO_TOKEN + ID dans app.json), on ne publie pas.
      - name: Vérifier la configuration Expo
        id: ready
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice::Secret EXPO_TOKEN absent : publication sautée."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          elif ! node -e "process.exit(require('./app.json').expo.extra?.eas?.projectId ? 0 : 1)"; then
            echo "::notice::ID du projet Expo absent de app.json : publication sautée."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        if: steps.ready.outputs.ok == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci
        if: steps.ready.outputs.ok == 'true'

      - name: Publier la mise à jour
        if: steps.ready.outputs.ok == 'true'
        env:
          # Passé par variable d'environnement : un message de commit avec des guillemets ne casse pas la commande.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'Publication manuelle' }}
        run: eas update --branch main --message "$(printf '%s' "$COMMIT_MESSAGE" | head -n 1)" --non-interactive
