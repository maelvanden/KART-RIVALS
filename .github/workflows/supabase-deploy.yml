# Déploie le backend Supabase à chaque push sur main qui touche supabase/ (ou à la main depuis l'onglet Actions) :
#   1. applique les nouvelles migrations SQL (une seule fois chacune, suivi dans deploy.migrations) ;
#   2. enregistre le secret OCR_SPACE_API_KEY de l'Edge Function (lecture des tickets) ;
#   3. déploie les Edge Functions.
# Tout passe par l'API de gestion Supabase : seul le secret GitHub SUPABASE_ACCESS_TOKEN est nécessaire
# (jeton personnel créé sur supabase.com > Account > Access Tokens).
name: Déployer Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

env:
  PROJECT_REF: ttbnpayuvwvhcceciwdb
  # Migrations déjà installées via supabase/setup.sql avant la mise en place de ce déploiement.
  BASELINE: '20261016000012'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      OCR_SPACE_API_KEY: ${{ secrets.OCR_SPACE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la configuration
        id: ready
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::Secret SUPABASE_ACCESS_TOKEN absent : déploiement sauté."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Appliquer les migrations
        if: steps.ready.outputs.ok == 'true'
        run: |
          set -euo pipefail
          # Exécute du SQL via l'API de gestion ; échoue avec le message de Postgres en cas d'erreur.
          query() {
            local body response status
            body=$(jq -n --arg q "$1" '{query: $q}')
            response=$(curl -sS -w '\n%{http_code}' -X POST \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$body")
            status=$(tail -n1 <<<"$response")
            response=$(sed '$d' <<<"$response")
            if [ "$status" -ge 300 ]; then
              echo "::error::Requête SQL refusée ($status) : $response" >&2
              return 1
            fi
            printf '%s' "$response"
          }

          query "
            create schema if not exists deploy;
            revoke all on schema deploy from public, anon, authenticated;
            create table if not exists deploy.migrations (
              version text primary key,
              applied_at timestamptz not null default now()
            );
          " > /dev/null

          # Migrations installées par setup.sql, et Time Attack si elle a déjà été collée à la main.
          baseline_values=""
          for file in supabase/migrations/*.sql; do
            version=$(basename "$file" | cut -d_ -f1)
            if [[ "$version" < "$BASELINE" || "$version" == "$BASELINE" ]]; then
              baseline_values+="('$version'),"
            fi
          done
          query "
            insert into deploy.migrations (version) values ${baseline_values%,} on conflict do nothing;
            insert into deploy.migrations (version)
              select '20261017000013' where to_regclass('public.time_attack_sessions') is not null
              on conflict do nothing;
          " > /dev/null

          applied=$(query "select coalesce(json_agg(version), '[]') as v from deploy.migrations" | jq -r '.[0].v[]')
          for file in supabase/migrations/*.sql; do
            version=$(basename "$file" | cut -d_ -f1)
            if grep -qx "$version" <<<"$applied"; then
              continue
            fi
            echo "Application de $(basename "$file")"
            query "begin;
          $(cat "$file")
          ;
          insert into deploy.migrations (version) values ('$version');
          commit;" > /dev/null
          done
          echo "Migrations à jour."

      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.ready.outputs.ok == 'true'

      - name: Secret de l'Edge Function
        if: steps.ready.outputs.ok == 'true' && env.OCR_SPACE_API_KEY != ''
        run: npx supabase secrets set OCR_SPACE_API_KEY="$OCR_SPACE_API_KEY" --project-ref "$PROJECT_REF"

      - name: Déployer les Edge Functions
        if: steps.ready.outputs.ok == 'true'
        run: |
          npx supabase functions deploy time-attack-ticket --project-ref "$PROJECT_REF" --use-api
          npx supabase functions deploy delete-account --project-ref "$PROJECT_REF" --use-api
